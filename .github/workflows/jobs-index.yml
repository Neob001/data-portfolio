# Daily: re-validate known boards (skipping any ATS under a recorded Retry-After ban), build the
# slim jobs index, publish it as assets of the `jobs-index` release (publish_index.sh, option a).
name: jobs-index daily

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/jobs-index.yml']

permissions:
  contents: write

concurrency:
  group: jobs-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: scripts/jobs_index
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # validate.jsonl checkpoint + bans.json (Retry-After bans) survive between daily runs.
      - name: Restore validation state
        uses: actions/cache/restore@v4
        with:
          path: scripts/jobs_index/state
          key: jobs-index-state-${{ github.run_id }}
          restore-keys: jobs-index-state-

      - name: Show active rate-limit bans
        run: cat state/bans.json 2>/dev/null || echo "no bans"

      # New Workday, Personio and Teamtailor career sites from the newest Common Crawl crawl (zipnum reads of
      # data.commoncrawl.org; each (crawl, host) unit is checkpointed in state/, so this is a ~1 min no-op until a
      # new crawl appears, and --max-blocks bounds a large one: the rest resumes the next night).
      - name: Discover new career sites (Workday, Personio, Teamtailor, Pinpoint)
        timeout-minutes: 20
        continue-on-error: true
        run: python3 discover_boards.py --ats workday,personio,teamtailor,pinpoint --mode zipnum --crawls 1 --walk-back 0 --max-blocks 40

      # New JazzHR companies from JazzHR's public job sitemaps (app.jazz.co/feeds/google/xml/0..4, listed in every
      # applytojob.com robots.txt; app.jazz.co robots.txt read first). 5 requests, ~20 MB; adds to jazzhr_candidates.json.
      - name: Discover new JazzHR career pages (public sitemaps)
        timeout-minutes: 15
        continue-on-error: true
        run: python3 discover_jazzhr.py

      # Re-checks boards not checked in the last ~6 days (the daily build itself drops boards that fail). An ATS with an active
      # ban in state/bans.json (e.g. Workable after a 429 with a long Retry-After) is skipped;
      # a new long Retry-After records a ban and stops calling that ATS for this run.
      # Never-checked candidates (workday/personio/teamtailor/jazzhr/pinpoint_candidates.json + new discoveries) are capped at
      # 1,500 per ATS per night (~25 min for Workday at 4 requests/s; Personio/Teamtailor ~1.2 s per board and pool, so ~30 min),
      # all in parallel with the other ATSs. robots.txt of each career-site host is read first (Accept: text/plain).
      - name: Refresh board validation
        timeout-minutes: 180
        run: python3 validate_boards.py --max-age-hours 150 --max-new 1500

      # Workday since 2026-11-16 answers robots.txt with HTTP 429 to cloud IPs (GitHub runners, Apify), 200 to the owner's
      # Mac. scripts/jobs_index/workday_local.sh reads every Workday site there (same code + robots.txt rule + pacing) and
      # force-pushes the result to the data-only branch workday-data. The build adds those boards (--boards-from) when the
      # file is complete, <= 36 h old and has >= 500 boards; otherwise it fetches Workday itself as before.
      - name: Fetch Workday boards read on the owner's Mac (branch workday-data)
        continue-on-error: true
        run: |
          if git fetch -q --depth 1 origin workday-data && git show FETCH_HEAD:workday_boards.jsonl.gz > workday_boards.jsonl.gz; then
            git log -1 --format='%s' FETCH_HEAD
          else
            rm -f workday_boards.jsonl.gz; echo "no workday-data branch: the build fetches Workday itself"
          fi

      # Builder also honours state/bans.json; per ATS it pauses that ATS on a 429 (30 s doubling to 5 min, slower pacing, the boards retried later; robots.txt 429/5xx count as "try later", never as permission) and stops it for the night after 6 pauses in a row without a success.
      # Workday runs in parallel with the other ATSs inside its own budget (see build_index.mjs): newest
      # 500 jobs per site, 90 s per site, no new site after 100 min, so the fetch phase ends about with
      # Workable (~100 min at 3 s per board). Personio and Teamtailor are two more parallel queues with their own
      # budgets and breakers (measured 2026-10-14 on every valid board: Personio 2,396 boards in 19 min, Teamtailor 1,956 in 16 min; budget 45 min each).
      # JazzHR and Pinpoint are two more parallel queues (robots.txt per host, one request in flight per host, <= 4 resp.
      # 2 requests/s), each inside its own budget (80 / 30 min, so they end well before Workday/Workable at ~100 min and add
      # only dedupe/shard time, ~1-2 min). Their state (list results + job-page details) is cached in state/hosted/, so after
      # the first nights only JazzHR boards whose jobs changed in the public sitemaps and job pages of new jobs are read.
      - name: Build slim index
        timeout-minutes: 140
        run: node --max-old-space-size=6144 build_index.mjs --codec br --workday-max-jobs 500 --workday-site-budget-s 90 --workday-budget-min 100 --personio-budget-min 75 --teamtailor-budget-min 45 --teamtailor-max-jobs 1000 --jazzhr-budget-min 80 --pinpoint-budget-min 30 --jazzhr-max-details 15 --pinpoint-max-details 10 --boards-from workday_boards.jsonl.gz

      - name: Save validation state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/jobs_index/state
          key: jobs-index-state-${{ github.run_id }}

      - name: Publish (GitHub release assets)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ./publish_index.sh
          publish_github_release "${{ github.repository }}"

      - name: Build report
        if: always()
        run: cat index/build_report.json || true
